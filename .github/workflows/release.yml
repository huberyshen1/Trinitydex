name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Package PC Version
      - name: Package PC Version (ZIP)
        run: |
          zip -r trinity-draft-pc.zip dist/

      # 2. Build Android App using Capacitor
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Copy Web Assets and Sync
        run: |
          npx cap sync android

      - name: Build Android APK (Gradle Debug Build)
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../trinity-draft-android.apk
          cd ..

      # 3. Create GitHub Release and Upload Assets
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            trinity-draft-pc.zip
            trinity-draft-android.apk
          name: Release v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
