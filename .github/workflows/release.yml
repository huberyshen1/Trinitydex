name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Package PC Version
      - name: Package PC Version (ZIP)
        run: |
          zip -r trinity-draft-pc.zip dist/

      # 2. Build Android App using Capacitor
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android @capacitor/assets

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Upgrade Gradle Wrapper to 8.9
        run: |
          python3 patch_gradle.py

      - name: Generate Android App Icons
        run: |
          npx @capacitor/assets generate --android

      - name: Copy Web Assets and Sync
        run: |
          npx cap sync android

      - name: Build Android APK (Gradle Debug Build)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -n 500 || {
            echo "=== GRADLE BUILD FAILED ==="
            exit 1
          }
          cp app/build/outputs/apk/debug/app-debug.apk ../trinity-draft-android.apk
          cd ..

      # 3. Deploy to GitHub Pages (gh-pages branch)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # 4. Create GitHub Release and Upload Assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            trinity-draft-pc.zip
            trinity-draft-android.apk
          name: Release v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
