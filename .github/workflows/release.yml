name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Package PC Version
      - name: Package PC Version (ZIP)
        run: |
          zip -r trinity-draft-pc.zip dist/

      # 2. Build Android App using Capacitor
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android @capacitor/assets

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Patch Gradle configurations with BouncyCastle 1.78 Override
        run: |
          python patch_gradle.py

      - name: Generate Android App Icons
        run: |
          npx @capacitor/assets generate --android

      - name: Copy Web Assets and Sync
        run: |
          npx cap sync android

      - name: Build Android APK (Gradle Debug Build)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace > ../build.log 2>&1 || {
            echo "=== GRADLE BUILD FAILED ==="
            tail -n 300 ../build.log
            exit 1
          }
          cp app/build/outputs/apk/debug/app-debug.apk ../trinity-draft-android.apk
          cd ..

      - name: Upload Build Log to Repository on Failure
        if: failure()
        run: |
          git config --global user.name "Trinity Draft Helper"
          git config --global user.email "trinity-draft-helper@users.noreply.github.com"
          git add build.log
          git commit -m "build: upload build failure logs [skip ci]" || exit 0
          git push origin main || exit 0

      # 3. Create GitHub Release and Upload Assets
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            trinity-draft-pc.zip
            trinity-draft-android.apk
          name: Release v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
